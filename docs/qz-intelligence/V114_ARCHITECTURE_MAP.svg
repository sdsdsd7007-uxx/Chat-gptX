<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="t d"><title id="t">Project Q and Z Hyper-Nexus architecture</title><desc id="d">Proposed architecture: MD-SIU, QR-DTS and UVSGM feed a recommendation stage that passes through deterministic policy and appropriate authorization before bounded execution. Not deployed.</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="600" y="18" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">PROPOSED DESIGN ONLY — NOT DEPLOYED</text><rect x="340" y="24" width="520" height="64" rx="12" fill="#dbeafe" stroke="#334155"/><text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">MISSION / GOAL / SCOPE</text><text x="600" y="70" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Intent • constraints • permitted data • owner</text><rect x="340" y="120" width="520" height="72" rx="12" fill="#e2e8f0" stroke="#334155"/><text x="600" y="144" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">IDENTITY + DETERMINISTIC POLICY</text><text x="600" y="166" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Authenticated mandate • least privilege • expiry</text><rect x="45" y="238" width="330" height="125" rx="12" fill="#d1fae5" stroke="#334155"/><text x="210" y="262" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">QR-DTS • TRUTH & SYNC</text><text x="210" y="284" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Revisions • duplicate handling • conflict review</text><text x="210" y="301" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">PQC inventory • reconciliation • recovery</text><rect x="435" y="238" width="330" height="125" rx="12" fill="#dbeafe" stroke="#334155"/><text x="600" y="262" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">MD-SIU • ANALYSIS</text><text x="600" y="284" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Evidence/factor units • scenarios</text><text x="600" y="301" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Independent challenge • calibration • abstention</text><rect x="825" y="238" width="330" height="125" rx="12" fill="#fef3c7" stroke="#334155"/><text x="990" y="262" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">UVSGM • VALUES GOVERNANCE</text><text x="990" y="284" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Itqan • Amanah • Shura • Adl</text><text x="990" y="301" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Ihsan • Sustainability • Rahmah</text><rect x="340" y="420" width="520" height="70" rx="12" fill="#e9d5ff" stroke="#334155"/><text x="600" y="444" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">RECOMMENDATION + EXACT PROPOSAL</text><text x="600" y="466" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Trade-offs • uncertainty • cost • rollback</text><rect x="340" y="526" width="520" height="70" rx="12" fill="#fee2e2" stroke="#334155"/><text x="600" y="550" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">AUTHORIZED HUMAN / POLICY GATE</text><text x="600" y="572" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Scope-specific approval • no self-approval</text><rect x="340" y="632" width="520" height="70" rx="12" fill="#dbeafe" stroke="#334155"/><text x="600" y="656" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">BOUNDED EXECUTION + VERIFICATION</text><text x="600" y="678" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Read-only first • budgets • stop/revoke • audit</text><rect x="340" y="738" width="520" height="58" rx="12" fill="#e2e8f0" stroke="#334155"/><text x="600" y="762" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">LEARNING & REPORTING</text><text x="600" y="784" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Evidence-backed KPIs • graphs • next review</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#475569"/></marker></defs><path d="M600 88 V118" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><path d="M600 192 V211 H210 V236" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><path d="M600 192 V236" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><path d="M600 211 H990 V236" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><path d="M210 364 V390 H600 V418" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><path d="M600 364 V418" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><path d="M990 364 V390 H600 V418" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><path d="M600 490 V524" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><path d="M600 596 V630" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><path d="M600 702 V736" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><text x="28" y="440" font-family="Arial" font-size="12" fill="#64748b">Shared controls: source provenance • privacy • authorization • audit • recovery • human appeal</text></svg>