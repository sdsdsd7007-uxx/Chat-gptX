<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="410" viewBox="0 0 1060 410" role="img" aria-labelledby="t d"><title id="t">Proposed v114 integration roadmap</title><desc id="d">Proposed relative week sequence from week zero to twelve. It is not actual progress or a committed calendar.</desc><rect width="100%" height="100%" fill="#fff"/><text x="300" y="34" font-family="Arial" font-size="21" font-weight="700" fill="#0f172a">v114 Concept Track — Proposed Roadmap</text><text x="300" y="58" font-family="Arial" font-size="13" fill="#64748b">Relative weeks, not actual dates or committed delivery</text><line x1="300" y1="86" x2="300" y2="358" stroke="#e2e8f0"/><text x="300" y="380" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">W0</text><line x1="419.16666666666663" y1="86" x2="419.16666666666663" y2="358" stroke="#e2e8f0"/><text x="419.16666666666663" y="380" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">W2</text><line x1="538.3333333333333" y1="86" x2="538.3333333333333" y2="358" stroke="#e2e8f0"/><text x="538.3333333333333" y="380" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">W4</text><line x1="657.5" y1="86" x2="657.5" y2="358" stroke="#e2e8f0"/><text x="657.5" y="380" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">W6</text><line x1="776.6666666666666" y1="86" x2="776.6666666666666" y2="358" stroke="#e2e8f0"/><text x="776.6666666666666" y="380" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">W8</text><line x1="895.8333333333334" y1="86" x2="895.8333333333334" y2="358" stroke="#e2e8f0"/><text x="895.8333333333334" y="380" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">W10</text><line x1="1015" y1="86" x2="1015" y2="358" stroke="#e2e8f0"/><text x="1015" y="380" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">W12</text><text x="282" y="122" text-anchor="end" font-family="Arial" font-size="13" fill="#334155">A • Inventory / owners / schema</text><rect x="300" y="100" width="119.16666666666663" height="31" rx="5" fill="#93c5fd" stroke="#475569"/><text x="359.5833333333333" y="120" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#0f172a">2 weeks</text><text x="282" y="177" text-anchor="end" font-family="Arial" font-size="13" fill="#334155">B • Offline tests / dependency review</text><rect x="419.16666666666663" y="155" width="119.16666666666663" height="31" rx="5" fill="#86efac" stroke="#475569"/><text x="478.74999999999994" y="175" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#0f172a">2 weeks</text><text x="282" y="232" text-anchor="end" font-family="Arial" font-size="13" fill="#334155">C • Read-only pilot / telemetry</text><rect x="538.3333333333333" y="210" width="238.33333333333337" height="31" rx="5" fill="#fcd34d" stroke="#475569"/><text x="657.5" y="230" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#0f172a">4 weeks</text><text x="282" y="287" text-anchor="end" font-family="Arial" font-size="13" fill="#334155">D • Staging / recovery / go-no-go</text><rect x="776.6666666666666" y="265" width="238.33333333333337" height="31" rx="5" fill="#c4b5fd" stroke="#475569"/><text x="895.8333333333333" y="285" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#0f172a">4 weeks</text><text x="300" y="388" font-family="Arial" font-size="11" fill="#64748b">Every phase requires evidence and independent review; a critical failure keeps production HOLD.</text></svg>