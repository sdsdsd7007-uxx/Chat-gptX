name: Project Q controlled foundation checks

on:
  pull_request:
    paths:
      - "project_q/**"
      - ".github/workflows/project-q-checks.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-q-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified commit resolved by the prior v4 run
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified commit resolved by the prior v5 run
        with:
          python-version: "3.11"
      - run: python -m pip install -r project_q/requirements-dev.txt
      - run: PYTHONPATH=project_q/src python -m unittest discover -s project_q/tests -v
