name: Project Q controlled foundation checks

on:
  pull_request:
    paths:
      - "project_q/**"
      - ".github/workflows/project-q-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r project_q/requirements-dev.txt
      - run: PYTHONPATH=project_q/src python -m unittest discover -s project_q/tests -v
